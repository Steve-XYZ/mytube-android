# preferIPv6: on this network the IPv4 path to dl.google.com/maven central
# serves 404s (broken ISP cache); the IPv6 path works. curl prefers IPv6 and
# works; the JVM defaults to IPv4 and fails without this flag.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.net.preferIPv6Addresses=true
android.useAndroidX=true
